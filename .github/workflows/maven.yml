# Builds + tests with Maven (JaCoCo coverage), publishes the coverage badge, and
# pushes a container image to GHCR.
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Build and Tests

on:
  push:
    branches: [ "dev", "develop" ]
  pull_request:
    branches: [ "dev", "develop" ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit the coverage badge on develop
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build, test, coverage
      run: |
        chmod +x ./mvnw
        ./mvnw -B verify --file pom.xml

    - name: Generate JaCoCo coverage badge
      id: jacoco-badge
      uses: cicirello/jacoco-badge-generator@v2
      with:
        jacoco-csv-file: target/site/jacoco/jacoco.csv
        badges-directory: .github/badges
        generate-coverage-badge: true
        generate-branches-badge: true

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-coverage-report
        path: target/site/jacoco/
        if-no-files-found: warn

    - name: Commit coverage badge
      if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "docs: update coverage badge [skip ci]"
        file_pattern: ".github/badges/*.svg"

    # Uploads the dependency graph to improve Dependabot alert quality.
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

  docker:
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ghcr.io/kevinthelago/wotos-vehicle-service:dev
